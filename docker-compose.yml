services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunayshallots_app
    restart: unless-stopped
    env_file: .env.production
    networks:
      - proxy
      - postgresql-wsnb_default
      - redis_public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      # HTTPS router
      - "traefik.http.routers.hunayshallots.rule=Host(`hunayshallots.com`) || Host(`www.hunayshallots.com`)"
      - "traefik.http.routers.hunayshallots.entrypoints=websecure"
      - "traefik.http.routers.hunayshallots.tls.certresolver=le"
      - "traefik.http.routers.hunayshallots.middlewares=hunayshallots-www-redirect@docker"
      - "traefik.http.services.hunayshallots.loadbalancer.server.port=3000"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.hunayshallots-http.rule=Host(`hunayshallots.com`) || Host(`www.hunayshallots.com`)"
      - "traefik.http.routers.hunayshallots-http.entrypoints=web"
      - "traefik.http.routers.hunayshallots-http.middlewares=hunayshallots-https-redirect@docker"
      # Middlewares
      - "traefik.http.middlewares.hunayshallots-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.hunayshallots-https-redirect.redirectscheme.permanent=true"
      - "traefik.http.middlewares.hunayshallots-www-redirect.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.hunayshallots-www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.hunayshallots-www-redirect.redirectregex.permanent=true"

networks:
  proxy:
    external: true
  postgresql-wsnb_default:
    external: true
  redis_public:
    external: true
