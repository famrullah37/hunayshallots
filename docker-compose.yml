services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hunayshallots_app
    restart: unless-stopped
    env_file: .env.production
    networks:
      - proxy
      - internal
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # HTTPS router
      - "traefik.http.routers.hunayshallots.rule=Host(`hunayshallots.com`) || Host(`www.hunayshallots.com`)"
      - "traefik.http.routers.hunayshallots.entrypoints=websecure"
      - "traefik.http.routers.hunayshallots.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hunayshallots.middlewares=www-redirect@docker"
      - "traefik.http.services.hunayshallots.loadbalancer.server.port=3000"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.hunayshallots-http.rule=Host(`hunayshallots.com`) || Host(`www.hunayshallots.com`)"
      - "traefik.http.routers.hunayshallots-http.entrypoints=web"
      - "traefik.http.routers.hunayshallots-http.middlewares=https-redirect@docker"
      # Middlewares
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"

  db:
    image: postgres:16-alpine
    container_name: hunayshallots_db
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
